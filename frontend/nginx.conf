# Per-IP limit on /ask, the only endpoint that spends LLM quota.
limit_req_zone $binary_remote_addr zone=ask:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the Caddy proxy (production) the TCP peer is Caddy, so take the real
    # client IP from X-Forwarded-For, but only when it comes from a Docker network.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # The UI calls /api/*; strip the prefix and forward to the FastAPI service
    # (same mapping as the proxy in vite.config.ts for `npm run dev`).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;  # a little above the backend's 60 s LLM timeout
    }

    location = /api/ask {
        limit_req zone=ask burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri /index.html;
    }
}
