server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The UI calls /api/*; strip the prefix and forward to the FastAPI service
    # (same mapping as the proxy in vite.config.ts for `npm run dev`).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;  # a little above the backend's 60 s LLM timeout
    }

    location / {
        try_files $uri /index.html;
    }
}
