services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devatlas
      POSTGRES_PASSWORD: devatlas
      POSTGRES_DB: devatlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
