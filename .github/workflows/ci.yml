name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devatlas
          POSTGRES_PASSWORD: devatlas
          POSTGRES_DB: devatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devatlas -d devatlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Offline hashing embedder: no model download in CI.
      EMBED_BACKEND: hash
      DATABASE_URL: postgresql://devatlas:devatlas@localhost:5432/devatlas
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create schema
        working-directory: .
        env:
          PGPASSWORD: devatlas
        run: psql -h localhost -U devatlas -d devatlas -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
